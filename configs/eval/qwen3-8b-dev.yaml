# FG-307 baseline on Spider dev, for the reference: one of the six dev looks, pushed with
# --reason baseline, which logs it (ADR-0004, docs/runbook.md "Baselines"). The model is
# configs/models.yaml's reference.qwen3-8b, Qwen's 4-bit AWQ checkpoint of Qwen3-8B, pinned
# to the same commit. As on val, the prompt is p2 (ADR-0007), the chosen model's, and the
# estimate is not worked out by plan section 3.8's eval formula: no run has measured this
# checkpoint on a T4.
model: Qwen/Qwen3-8B-AWQ@4da05a8edb55c6046cce958586c33b61da07bb79
backend: vllm
quantization: awq
split: dev
limit: null
prompt_version: p2
n: 1
temperature: 0.0
retry: 0
ops:
  est_gpu_hours: 0.5
