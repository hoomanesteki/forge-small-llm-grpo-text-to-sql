# The local GRPO pilot on Apple silicon's GPU (ADR-0016, FG-591): configs/models.yaml's
# pilot from the adapter of the FG-491 SFT pilot, trained on the train rows its filter
# eval picked, with its in-training eval on val. The run says local-mps, and its numbers
# are a pilot's, on val only.
#
#   FORGE_DATA_DIR=data/spider PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.45 \
#     PYTORCH_MPS_LOW_WATERMARK_RATIO=0.35 \
#     uv run forge train grpo --config configs/grpo/pilot-qwen25coder05b-mps.yaml \
#     --grpo-dir docs/runs/grpo
#
# The watermarks are the SFT pilot's (configs/sft/pilot-qwen25coder05b-mps.yaml); they
# change no number the run computes. Before the run no virtual machine was running, and
# memory_pressure put free memory at 61%, with 5.3 of the 6.0 GB of swap holding older
# pages: the cap, not the laptop, set the batch below, and the completion length stays.
run:
  kind: grpo
  model_ref: Qwen/Qwen2.5-Coder-0.5B-Instruct@ea3f2471cf1b1f0db85067f1ef93848e38e88c25
  seed: 42
  backend: trl
  device: mps
data:
  prompt_version: p1
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
grpo:
  # The FG-491 run's only adapter, the one its val run scored: it trained a single
  # checkpoint, so it has no checkpoints/best. Its folder goes in runs/ whole, with its
  # manifest.
  init_adapter: runs/2026-11-16-qwen2-5-coder-0-5b-instruct-sft-db0d8d8/checkpoints/final
  # That adapter's greedy replies to the first 3,000 train questions (FG-505), whose rows
  # forge data build-grpo kept in docs/runs/grpo/<this id>/.
  filter_from: 2026-11-17-qwen2-5-coder-0-5b-instruct-eval-a27afde
  # The first 40% of steps draw from easy and medium questions alone (plan FG-505).
  curriculum: {share: 0.4, hardness: [easy, medium]}
  # 8 completions a step, 2 prompts with 4 replies each: TRL generates all 8 at once and
  # trains on them one at a time, since two at a time didn't fit the 5.33 GiB the high
  # watermark allows. A first probe on every GRPO row, 4 at a time, ran out of it at its
  # step 8, in the backward pass of TRL's chunked log-probabilities; a second, 2 at a time,
  # ran its 10 steps at 31.6 s a step, but the first start of this run, at a23607a, 2 at a
  # time on the filter's rows, ran out of it at step 24 in the same place (5.08 GiB held,
  # 328 MiB asked for). Its folder was removed and the run made again from the next commit.
  num_generations: 4
  max_prompt_length: 1536
  max_completion_length: 128
  learning_rate: 5.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  # The timing probe: 10 steps of these settings from the same adapter on the filter's rows,
  # with an in-training eval at its last step, took 20.2 s a step (11.7 to 40.5 s) and 115 s
  # for the eval of 200 val questions. At that pace 350 steps with an eval every 50 take
  # 350 x 20.2 + 7 x 115 = 7,875 s, about 2.2 h: inside the 2 to 3 h the pilot may take,
  # with room for steps that run as slow as the second probe's (FG-591).
  max_steps: 350
  beta: library_default
  # Each in-training eval falls on a checkpoint, so its EX is that checkpoint's.
  eval_every: 50
  eval_examples: 200
rewards:
  execution: 1.0
  validity: 0.1
  format: 0.05
  guards: {non_select: -1.0, multiple_statements: -0.5, constant_query: -0.5, comment_payload: -0.2}
ops:
  checkpoint_every: 50
  # Every checkpoint stays: steps 50 to 300 beside checkpoints/final, step 350, so the one
  # with the best in-training val EX can be scored on all of val. Each share is a little
  # over k/7, so that its step, rounded down, is the checkpoint's.
  keep_checkpoints_at: [0.143, 0.286, 0.429, 0.572, 0.715, 0.858]
  # Not a Kaggle budget: what the probe puts the run at.
  est_gpu_hours: 2.2
