# FG-404's Kaggle SFT pilot: a short run of the model ADR-0012 chose,
# Qwen/Qwen2.5-Coder-1.5B-Instruct at the commit of configs/models.yaml's
# candidates.qwen2-5-coder-1-5b, on p2 (ADR-0007), with every setting of the main run
# (configs/sft/qwen25coder-1p5b-main.yaml) but the rows it takes and how its first session
# ends. It rehearses the main run's Kaggle path end to end before the main run spends its
# hours (FG-496): its first session stops after step 50 (ops.stop_after_step), saving that
# checkpoint as the time guard does, and the kernel exits cleanly; a second session,
# forge kaggle run --resume, restores the run from that kernel's output and trains it to
# its end. docs/runbook.md, "SFT runs", has the commands.
#
# fp16 on the T4 with fp32 adapters, and no 4-bit: the 1.5B base fits a T4 in fp16
# (ADR-0010's note of 2026-11-17).
run:
  kind: sft
  model_ref: Qwen/Qwen2.5-Coder-1.5B-Instruct@2e1fd397ee46e1388853d2af2c993145b0f1098a
  seed: 42
  backend: auto
  device: auto
  load_in_4bit: false
data:
  prompt_version: p2
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
sft:
  learning_rate: 2.0e-4
  num_train_epochs: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  # 16 rows an optimizer step.
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 2048
  # 1,600 of the train rows that fit, drawn by hash with the run's seed: 100 steps, 50 in
  # each session.
  subset_rows: 1600
  logging_steps: 10
ops:
  checkpoint_every: 50
  stop_after_step: 50
  # Each session's kernel stops sooner, at its push's timeout less the share kept back for
  # the save and the upload (kaggle/entry.py).
  time_guard_minutes: 675
  # Plan section 3.8's SFT pilot row, both sessions in it: an estimate, since no SFT has
  # run on a T4 yet. Each push budgets it and gets its timeout from it.
  est_gpu_hours: 1.0
