# The Kaggle SFT pilot (FG-404): 1 epoch on the small candidate, to show the GPU setup works
# before the main run. Qwen/Qwen3-1.7B is pinned at the commit of configs/models.yaml's
# qwen3-1-7b candidate (FG-307). It loads in 4-bit, as the main run does, so the pilot
# runs the path the main run takes (ADR-0010).
run:
  kind: sft
  model_ref: Qwen/Qwen3-1.7B@70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  seed: 42
  backend: auto
  device: auto
  load_in_4bit: true
data:
  prompt_version: p1
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
sft:
  learning_rate: 2.0e-4
  num_train_epochs: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  # 16 rows an optimizer step.
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 2048
  logging_steps: 10
ops:
  checkpoint_every: 50
  time_guard_minutes: 675
  est_gpu_hours: 1.0  # plan section 3.8
