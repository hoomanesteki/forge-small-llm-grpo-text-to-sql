# The main Kaggle SFT run (FG-404): 1 epoch on the chosen model. Qwen/Qwen3-4B is the
# plan's choice and configs/models.yaml's qwen3-4b candidate, pinned at its commit; FG-307
# fixes the model from measured baselines (ADR-0012) and may change it. In 4-bit on the
# T4, with fp16 compute and fp32 adapters (ADR-0006, ADR-0010).
run:
  kind: sft
  model_ref: Qwen/Qwen3-4B@1cfa9a7208912126459214e8b04321603b3df60c
  seed: 42
  backend: auto
  device: auto
  load_in_4bit: true
data:
  prompt_version: p1
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
sft:
  learning_rate: 2.0e-4
  num_train_epochs: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  # Still 16 rows an optimizer step, in micro-batches of 2 for the larger model's memory.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_length: 2048
  logging_steps: 10
ops:
  checkpoint_every: 50
  time_guard_minutes: 675
  est_gpu_hours: 2.5  # plan section 3.8
