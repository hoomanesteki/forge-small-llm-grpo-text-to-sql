# Runs a story needs that haven't been made and committed yet. Each entry says what blocks
# it and since when, how to run it and what it fills in. The story that makes the run
# removes its entry in the same change and adds its ledger row. Nothing here is a result.
# An entry with configs runs each of them, or, with pick, the one it names;
# tests/integration/test_artifacts.py skips a story's run checks only while the story has
# an entry here. An entry whose run was made, with its ledger row, but can't be committed
# yet names it in run_id.
pending:
  - story: FG-404
    run: sft-pilot
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/sft/qwen25coder-1p5b-pilot.yaml
    est_gpu_hours: 1.0
    status: blocked
    since: 2026-11-17
    blocked_on:
      - nothing but the operator running it, the first of FG-404's runs, in two sessions, the first stopped after step 50 by its config's ops.stop_after_step and the second a forge kaggle run --resume that restores the run from the first kernel's output and finishes it
    how: docs/runbook.md, "SFT runs", steps 1 and 2
    fills:
      - docs/runs/<run_id>/, the SFT run without its checkpoints, which the run store holds, with the sessions.json of both sessions
      - docs/compute-ledger.md, one kaggle row a session (forge kaggle wait)
  - story: FG-404
    run: sft-pilot-val
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/eval/qwen2-5-coder-1-5b-val-p2.yaml
    est_gpu_hours: 0.3
    status: blocked
    since: 2026-11-17
    blocked_on:
      - nothing but the operator running it once the sft-pilot run has finished, with --adapter runs/<pilot_run_id>/checkpoints/final, which the kernel copies from the output of the pilot's last kernel (FG-495)
    how: docs/runbook.md, "SFT runs", step 3
    fills:
      - docs/runs/<run_id>/, the run whole with its report rendered on the laptop
      - docs/runs/<pilot_run_id>/best.json and the pilot's checkpoints/best (forge runs promote)
      - docs/compute-ledger.md, one kaggle row (forge kaggle wait)
  - story: FG-404
    run: sft-main
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/sft/qwen25coder-1p5b-main.yaml
    est_gpu_hours: 2.5
    status: blocked
    since: 2026-11-17
    blocked_on:
      - nothing but the operator running it once the pilot's val run shows the setup works
    how: docs/runbook.md, "SFT runs", step 4
    fills:
      - docs/runs/<run_id>/, the SFT run without its checkpoints, which the run store holds, with its sessions.json
      - docs/compute-ledger.md, one kaggle row a session (forge kaggle wait)
  - story: FG-404
    run: sft-main-checkpoints-val
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/eval/qwen2-5-coder-1-5b-val-p2.yaml
    est_gpu_hours: 0.6
    status: blocked
    since: 2026-11-17
    blocked_on:
      - nothing but the operator running them once the sft-main run has finished, one for each of its checkpoints at 50% (kept_at_0.5) and 100% (final), each with its --adapter, which the kernel copies from the output of the main run's last kernel (FG-495)
    how: docs/runbook.md, "SFT runs", steps 5 and 6, the config once a checkpoint, each with its --adapter
    fills:
      - docs/runs/<run_id>/ for each, the run whole with its report rendered on the laptop
      - docs/runs/<main_run_id>/best.json and the main run's checkpoints/best (forge runs promote)
      - docs/compute-ledger.md, one kaggle row a run (forge kaggle wait)
      - docs/progress.md, the product owner's call on a second epoch if val EX still rose
  - story: FG-405
    run: sft-main-comparison
    platform: kaggle
    accelerator: none (a report the laptop writes from two committed kernel runs)
    est_gpu_hours: 0
    status: blocked
    since: 2026-11-17
    # The base run it is compared with is committed: FG-307's val run of ADR-0012's choice at
    # p2, the prompt the main run trains on, 2026-11-16-qwen2-5-coder-1-5b-p2-c8f4b41.
    blocked_on:
      - nothing but the operator running it once FG-404's runs are committed, the main run's best.json naming the val run of its checkpoints/best, which is compared with 2026-11-16-qwen2-5-coder-1-5b-p2-c8f4b41
    how: docs/runbook.md, "SFT runs", step 7
    fills:
      - docs/runs/<best_val_run_id>/eval/compare-2026-11-16-qwen2-5-coder-1-5b-p2-c8f4b41.md (forge report compare)
      - docs/notes/sft.md, bullets on the main model from that report, beside the pilot's
