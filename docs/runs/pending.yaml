    accelerator: none (an upload of a finished run)
    est_gpu_hours: 0
    status: blocked
    since: 2026-11-16
    # forge.ops.adapters.adapter_sha256 of runs/<run_id>/checkpoints/final on the laptop that
    # trained it, taken after both runs, on the files the eval run read (docs/runs/README.md).
    adapter_sha256: e84967ce9d31e90d9f8dba217fa4b79e56e91d64fdf2919bfbd5b6be60739562
    blocked_on:
      - nothing but the operator running the push below; the Hugging Face account, its write token and the run store repo exist since 2026-11-16
    how: docs/runbook.md, "Run store", forge runs push 2026-11-16-qwen2-5-coder-0-5b-instruct-sft-db0d8d8 --adapter-sha256 e84967ce9d31e90d9f8dba217fa4b79e56e91d64fdf2919bfbd5b6be60739562, which uploads nothing unless checkpoints/final holds those files
