# Runs a story needs that haven't been made and committed yet. Each entry says what blocks
# it and since when, how to run it and what it fills in. The story that makes the run
# removes its entry in the same change and adds its ledger row. Nothing here is a result.
# An entry with configs runs each of them, or, with pick, the one it names;
# tests/integration/test_artifacts.py skips a story's run checks only while the story has
# an entry here.
pending:
  - story: FG-307
    run: reference-val
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/eval/qwen3-8b-val.yaml
    est_gpu_hours: 0.45
    status: blocked
    since: 2026-11-17
    blocked_on:
      - the operator pushing it from FG-307's pushed commit, whose reference configs use p2
        (ADR-0007); it is the first run to load the AWQ checkpoint Qwen/Qwen3-8B-AWQ on a
        T4 (FG-398), since vLLM 0.33.0 has no bitsandbytes (FG-301), so it may still fail
        at the load
    how: docs/runbook.md, "Baselines", step 3
    fills:
      - docs/runs/<run_id>/, the run whole with its report rendered on the laptop
      - docs/compute-ledger.md, one kaggle row a run (forge runs pull)
      - docs/adr/0012-model-choice.md, the reference's val EX in its Measured section
  - story: FG-307
    run: chosen-dev
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/eval/qwen2-5-coder-1-5b-dev.yaml
    est_gpu_hours: 0.35
    status: blocked
    since: 2026-11-17
    blocked_on:
      - the operator pushing it from FG-307's pushed commit, whose config runs the model
        ADR-0012 chose, Qwen/Qwen2.5-Coder-1.5B-Instruct, with p2 (ADR-0007)
    how: docs/runbook.md, "Baselines", step 5
    fills:
      - docs/runs/<run_id>/, the run whole with its report rendered on the laptop
      - docs/compute-ledger.md, one kaggle row a run (forge runs pull)
      - docs/dev-usage.md, dev look 1
      - docs/adr/0012-model-choice.md, the chosen model's dev EX in its Measured section
  - story: FG-307
    run: reference-dev
    platform: kaggle
    accelerator: NvidiaTeslaT4
    configs:
      - configs/eval/qwen3-8b-dev.yaml
    est_gpu_hours: 0.5
    status: blocked
    since: 2026-11-17
    blocked_on:
      - the operator pushing it from FG-307's pushed commit, with p2 (ADR-0007), once the
        reference's val run above has loaded the AWQ checkpoint on a T4 (FG-398), since
        this push spends a dev look
    how: docs/runbook.md, "Baselines", step 5
    fills:
      - docs/runs/<run_id>/, the run whole with its report rendered on the laptop
      - docs/compute-ledger.md, one kaggle row a run (forge runs pull)
      - docs/dev-usage.md, dev look 2
      - docs/adr/0012-model-choice.md, the reference's dev EX in its Measured section
