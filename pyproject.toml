[project]
name = "forge"
version = "0.0.1"
description = "Post-train a small open LLM with GRPO on verifiable text-to-SQL rewards, on free GPUs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hooman Esteki" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.24",
    "kaggle>=1.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.11",
    "sqlglot>=25.0",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
# CPU training and inference: used locally and in CI. GPU packages (unsloth, vllm,
# bitsandbytes) are pinned in kaggle/requirements-gpu.txt against the Kaggle image
# instead of this lock file, see docs/adr/0002-dependency-pins.md.
cpu = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.19",
]
demo = [
    "gradio>=5.0",
    "llama-cpp-python>=0.3",
]

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.uv]
default-groups = ["dev"]

# Linux (CI, Kaggle CPU sessions) gets CPU-only torch wheels; macOS uses PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["forge"]

[tool.mypy]
python_version = "3.11"
files = ["src/forge"]
exclude = ["third_party/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Strict where correctness matters most: contracts, SQL sandbox, evaluation, rewards.
[[tool.mypy.overrides]]
module = ["forge.core.*", "forge.sql.*", "forge.eval.*", "forge.train.rewards"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers -p pytester"
markers = [
    "phase(n): plan phase that introduced the test (required on every test)",
    "requires_full_data: needs the full Spider download; skipped when it is absent",
]
