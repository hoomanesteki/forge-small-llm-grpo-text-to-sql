[project]
name = "forge"
version = "0.2.0"
description = "Post-train a small open LLM with GRPO on verifiable text-to-SQL rewards, on free GPUs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hooman Esteki" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    # huggingface-hub's HTTP client: forge data fetch catches its transport errors, which
    # are not OSErrors.
    "httpx2>=2.0",
    "huggingface-hub>=0.24",
    "kaggle>=1.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.11",
    # The kaggle 2.x CLI imports six but does not declare it.
    "six>=1.16",
    "sqlglot>=25.0",
    # The vendored Spider evaluator (third_party/test_suite_eval) needs sqlparse and tqdm.
    # From 0.5.5 sqlparse raises SQLParseError past its grouping limits on huge inputs;
    # 0.6.1 is held back until it has been out longer.
    "sqlparse>=0.5.5,<0.6.1",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
# CPU training and inference: used locally and in CI. GPU packages (unsloth, vllm,
# bitsandbytes) are pinned in kaggle/requirements-gpu.txt against the Kaggle image
# instead of this lock file, see docs/adr/0002-dependency-pins.md.
cpu = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.19",
]
demo = [
    "gradio>=5.0",
    "llama-cpp-python>=0.3",
]

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The vendored evaluator installs as the top-level package test_suite_eval.
packages = ["src/forge", "third_party/test_suite_eval"]

[tool.uv]
default-groups = ["dev"]

# Linux (CI, Kaggle CPU sessions) gets CPU-only torch wheels; macOS uses PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["forge"]

[tool.mypy]
python_version = "3.11"
# The kernel scripts run on Kaggle before Forge is installed, so they live outside the package.
files = ["src/forge", "kaggle/spike", "kaggle/entry.py"]
exclude = ["third_party/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Strict where correctness matters most: contracts, SQL sandbox, evaluation, rewards.
[[tool.mypy.overrides]]
module = ["forge.core.*", "forge.sql.*", "forge.eval.*", "forge.train.rewards"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers -p pytester"
markers = [
    "phase(n): plan phase that introduced the test (required on every test)",
    "requires_full_data: needs the full Spider download; skipped when it is absent",
]
